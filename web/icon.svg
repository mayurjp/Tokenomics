<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Token Economics Explorer">
  <!--
    The mark is the site's own core visual: a bill getting shorter. Three bars descending —
    full width, then two thirds, then a third — which is what every card on the site does to
    a token count. It survives 16px because it is three shapes and nothing else.
  -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect x="13" y="18" width="38" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="13" y="29" width="25" height="7" rx="3.5" fill="#4f46e5"/>
  <rect x="13" y="40" width="13" height="7" rx="3.5" fill="#0f766e"/>
</svg>
