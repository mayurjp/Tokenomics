<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Economics Explorer</title>
    <meta name="description" content="Fifteen cards on where LLM money actually goes: tokenizing, thinking tokens, prompt caching, retrieval, output caps, model routing, batch and FinOps." />

    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Premium Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Link previews. og:image must be an absolute URL and a raster format — LinkedIn and
         Slack will not render an SVG here. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mayurjp.github.io/Tokenomics/" />
    <meta property="og:title" content="Token Economics Explorer" />
    <meta property="og:description" content="On one measured call, 75% of the bill was reasoning the API never returns. Fifteen interactive cards on where LLM money actually goes — thinking tokens, caching, retrieval, output caps and model routing." />
    <meta property="og:image" content="https://mayurjp.github.io/Tokenomics/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- LinkedIn reads the author from article:author and reports it on the preview.
         og:type stays "website" — this is a tool, not a dated article, so there is no
         article:published_time to give and inventing one would be worse than omitting it. -->
    <meta name="author" content="Mayur Patel" />
    <meta property="article:author" content="Mayur Patel" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="./">
          <img class="brand-mark" src="icon.svg" alt="" width="30" height="30" />
          <h1>Token Economics Explorer</h1>
        </a>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <a href="handbook.html" style="padding: 0.4rem 0.8rem; text-decoration: none; display: inline-flex; align-items: center; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; font-weight: 600;">📒 Handbook</a>
          <button type="button" id="toggle-settings" class="ghost" style="padding: 0.4rem 0.8rem;">⚙️ Settings</button>
          <div class="tier-toggle">
            <button type="button" id="toggle-standard" class="active">Standard</button>
            <button type="button" id="toggle-advanced">Advanced</button>
            <button type="button" id="toggle-learning">Interactive Learning</button>
          </div>
        </div>
      </header>

      <div id="settings-panel" style="display: none;"></div>
      <div id="demo-banner"></div>
      <nav id="backbar" hidden></nav>
      <section id="cards"><p class="muted">Loading&hellip;</p></section>

      <footer>
        <p class="muted">
          Entirely static and entirely client-side. The numbers shown are illustrative
          rather than live — nothing here calls an API.
        </p>
      </footer>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
